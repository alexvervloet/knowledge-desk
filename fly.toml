# Fly.io config. Two process groups from one image: a web process (API + built
# UI) and a worker process (the background embedder). Migrations run once per
# deploy via the release command, so the processes never race to migrate.
#
# Deploying is a [Alex] step (account + cost). See the deployment section of
# WALKTHROUGH.md, and LESSONS.md #22 on the managed database's default role.

app = "knowledge-desk"
primary_region = "iad"

[build]

[deploy]
  release_command = "python -m knowledge_desk.migrate"

[env]
  SERVE_STATIC = "1"
  # DATABASE_URL (owner) and APP_DATABASE_URL (least-privilege app role) are set
  # as secrets, never committed. Provider/observability keys are secrets too.

  # The demo credentials are published in the README, so anyone can spend real
  # model budget here. The defaults ($5 per org per day, 1000 questions a month)
  # are sized for a tenant paying for itself, not for an open demo with two
  # seeded orgs. Tighter numbers cap the worst case at a couple of dollars a day
  # while leaving a reviewer plenty of room to try the thing.
  DAILY_BUDGET_USD = "1.00"
  MONTHLY_QUESTION_CAP = "300"
  RATE_BURST = "3"
  RATE_PER_MIN = "10"

  # The per-org numbers above bound one tenant, and signup is open, so a script
  # that creates orgs gets a fresh budget for each. This is the number that
  # actually caps a day's bill, whatever anyone does with the signup form.
  PLATFORM_DAILY_BUDGET_USD = "3.00"

  # Login and signup are throttled per caller address. Behind Fly's proxy the
  # socket peer is the proxy, so read the address from the header Fly sets and
  # overwrites on the way in (a client cannot forge it).
  CLIENT_IP_HEADER = "Fly-Client-IP"
  AUTH_RATE_BURST = "5"
  AUTH_RATE_PER_MIN = "5"

[processes]
  app = "uvicorn knowledge_desk.main:app --host 0.0.0.0 --port 8000"
  worker = "python -m knowledge_desk.worker"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
