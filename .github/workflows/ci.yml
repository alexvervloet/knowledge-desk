name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Start pgvector (docker compose)
        run: docker compose up -d db

      - name: Wait for database
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' knowledge-desk-pg 2>/dev/null || echo none)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "database never became healthy"; docker compose logs db; exit 1

      - name: Preflight
        run: python check_setup.py

      - name: Migrate
        run: python -m knowledge_desk.migrate

      - name: Tests
        run: python -m pytest -q

      - name: Eval gate (permission leak + grounded answer)
        run: python -m evals.run

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install ruff==0.8.4 mypy==1.14.0 pip-audit==2.7.3
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Audit Python dependencies
        # Advisory: a new CVE in a pinned dep should be visible without blocking
        # unrelated work. Promote to a hard gate once the noise level is known.
        continue-on-error: true
        run: pip-audit --requirement requirements.txt --strict

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Audit npm dependencies
        continue-on-error: true  # advisory, same reasoning as pip-audit
        run: npm audit --audit-level=high

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the full stack
        run: docker compose up -d --build || (docker compose logs; exit 1)

      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 40); do
            cid=$(docker compose ps -q api)
            status=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo none)
            echo "api: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          docker compose logs; exit 1

      - name: Smoke the running stack (seed, signup, ask)
        run: |
          curl -fsS localhost:8000/healthz; echo
          docker compose exec -T api python -m knowledge_desk.seed
          token=$(curl -fsS -X POST localhost:8000/auth/signup \
            -H 'Content-Type: application/json' \
            -d '{"org_slug":"ci-demo","org_name":"CI","email":"ci@ci.test","password":"pw-supersecret"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          curl -fsS -X POST localhost:8000/ask \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"question":"hello there"}'; echo
          # The built SPA is served same-origin.
          curl -fsS localhost:8000/ | grep -q "<div id=\"root\">" && echo "SPA served"

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Tear down
        if: always()
        run: docker compose down -v
