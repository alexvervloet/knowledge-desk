name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Start pgvector (docker compose)
        run: docker compose up -d

      - name: Wait for database
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' knowledge-desk-pg 2>/dev/null || echo none)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "database never became healthy"; docker compose logs db; exit 1

      - name: Preflight
        run: python check_setup.py

      - name: Migrate
        run: python -m knowledge_desk.migrate

      - name: Tests
        run: python -m pytest -q

      - name: Eval gate (permission leak + grounded answer)
        run: python -m evals.run

      - name: Tear down
        if: always()
        run: docker compose down -v
