name: dependabot auto-merge

# Dependabot opens PRs but nothing merges them, so they pile up until a human
# notices. This closes the loop for the low-risk half: patch and minor updates
# merge once CI is green. Major bumps are left open on purpose, because in this
# repo they have needed judgment every time (coupled peer deps, a moved import,
# a base image outrunning a dependency).
#
# Triggered on ci completion rather than on pull_request, and it merges only
# after seeing a successful run. The obvious alternative, `gh pr merge --auto`,
# only waits when the branch has required status checks, which would mean adding
# branch protection and giving up direct pushes to main.
#
# That trigger rules out `dependabot/fetch-metadata`, which reads the
# `pull_request` key out of the event payload and has no input for naming a pull
# request. Under `workflow_run` there is no such key, and the action fails with
# "PR is not from Dependabot, nothing to do", which is what it did here for
# months. The metadata is in the commit message trailer anyway, which is where
# scripts/dependabot_update_type.py reads it from. See LESSONS entry 46.

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Find the pull request and read Dependabot's own metadata
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          number=$(gh api "repos/$REPO/commits/$SHA/pulls" \
                     --jq '[.[] | select(.state=="open")][0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [ -z "$number" ]; then
            echo "no open pull request for $SHA"
            exit 0
          fi

          commit=$(gh api "repos/$REPO/commits/$SHA")
          author=$(jq -r '.author.login // ""' <<< "$commit")
          verified=$(jq -r '.commit.verification.verified' <<< "$commit")

          # The workflow_run actor is already checked above. This checks the
          # commit itself, which is the thing being merged.
          if [ "$author" != "dependabot[bot]" ] || [ "$verified" != "true" ]; then
            echo "commit is not a verified Dependabot commit (author=$author verified=$verified)"
            echo "verdict=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          verdict=$(jq -r '.commit.message' <<< "$commit" | python3 scripts/dependabot_update_type.py)
          echo "verdict=$verdict"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Merge patch and minor updates
        if: steps.pr.outputs.number != '' && steps.pr.outputs.verdict == 'minor-or-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh pr merge "${{ steps.pr.outputs.number }}" --repo "$REPO" --squash --delete-branch

      - name: Leave everything else for review
        if: steps.pr.outputs.number != '' && steps.pr.outputs.verdict != 'minor-or-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          VERDICT: ${{ steps.pr.outputs.verdict }}
        run: |
          set -euo pipefail

          # Dependabot rebases an open pull request every time main moves, and
          # each rebase runs ci again, which lands here again. Say it once.
          said=$(gh api "repos/$REPO/issues/$NUMBER/comments" \
                   --jq '[.[] | select(.user.login == "github-actions[bot]")
                              | select(.body | contains("left for manual review"))] | length')
          if [ "$said" -gt 0 ]; then
            echo "already left a review note on #$NUMBER"
            exit 0
          fi

          gh pr comment "$NUMBER" --repo "$REPO" --body \
            "CI is green, but this is a \`$VERDICT\` update so it is left for manual review. Before merging, check for coupled peers (react and react-dom must move together) and for moved imports (pgvector relocated \`Vector\` in 0.5.0)."
