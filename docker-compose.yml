services:
  db:
    image: pgvector/pgvector:pg17
    container_name: knowledge-desk-pg
    environment:
      POSTGRES_USER: kd
      POSTGRES_PASSWORD: kd
      POSTGRES_DB: knowledge_desk
    ports:
      # 5432 rag-at-scale, 5433/5435 in use, 5434 askrepo-live; this repo takes 5436
      - "5436:5432"
    volumes:
      - kd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kd -d knowledge_desk"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  kd_pgdata:
