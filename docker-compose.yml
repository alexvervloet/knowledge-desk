services:
  db:
    image: pgvector/pgvector:pg17
    container_name: knowledge-desk-pg
    environment:
      POSTGRES_USER: kd
      POSTGRES_PASSWORD: kd
      POSTGRES_DB: knowledge_desk
    ports:
      # 5432 rag-at-scale, 5433/5435 in use, 5434 askrepo-live; this repo takes 5436
      - "5436:5432"
    volumes:
      - kd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kd -d knowledge_desk"]
      interval: 3s
      timeout: 3s
      retries: 10

  # API + built UI + the job queue drain. Runs migrations on start (creates the
  # app role and RLS). No worker service: the API drains the queue itself.
  api:
    build: .
    environment:
      RUN_MIGRATIONS: "1"
      DATABASE_URL: postgresql://kd:kd@db:5432/knowledge_desk
      APP_DATABASE_URL: postgresql://kd_app:kd_app@db:5432/knowledge_desk
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  kd_pgdata:
